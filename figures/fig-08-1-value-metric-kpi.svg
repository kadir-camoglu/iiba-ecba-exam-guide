<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 854" width="960" height="854" role="img" aria-labelledby="title desc">
<title id="title">Value and how it is measured</title>
<desc id="desc">Author teaching diagram. Read the companion table for the full meaning.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#172b3a"/></marker></defs>
<rect x="0" y="0" width="960" height="854" fill="#ffffff"/>
<text x="36" y="48" font-size="28" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">Value and how it is measured</text>
<rect x="36" y="90" width="888" height="90" rx="10" fill="#edf6fb" stroke="#0072b2" stroke-width="2"/>
<text x="60" y="125" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">Desired outcome</text>
<text x="60" y="162" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">The business objective</text>
<path d="M 480 184 L 480 214" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="222" width="888" height="90" rx="10" fill="#fff4e5" stroke="#a65300" stroke-width="2"/>
<text x="60" y="257" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">Potential value · before delivery</text>
<text x="60" y="294" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">Financial and non-financial; estimated</text>
<path d="M 480 316 L 480 346" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="354" width="888" height="122" rx="10" fill="#edf6fb" stroke="#0072b2" stroke-width="2"/>
<text x="60" y="389" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">After delivery</text>
<text x="60" y="426" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">Value realized: new gains</text>
<text x="60" y="458" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">Value preserved: avoided loss or risk</text>
<rect x="36" y="518" width="888" height="90" rx="10" fill="#fff4e5" stroke="#a65300" stroke-width="2"/>
<text x="60" y="553" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">Metric</text>
<text x="60" y="590" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">Any tracked number</text>
<rect x="36" y="650" width="888" height="90" rx="10" fill="#edf6fb" stroke="#0072b2" stroke-width="2"/>
<text x="60" y="685" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">KPI</text>
<text x="60" y="722" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">A metric tied to a strategic goal</text>
<text x="480" y="798" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="middle">Every KPI is a metric; not every metric is a KPI.</text>
</svg>
