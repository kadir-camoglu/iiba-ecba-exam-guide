<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 770" width="960" height="770" role="img" aria-labelledby="title desc">
<title id="title">BACCM · six related concepts</title>
<desc id="desc">Author teaching diagram. Read the companion table for the full meaning.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#172b3a"/></marker></defs>
<rect x="0" y="0" width="960" height="770" fill="#ffffff"/>
<text x="36" y="48" font-size="28" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">BACCM · six related concepts</text>
<rect x="24" y="80" width="912" height="654" rx="10" fill="#edf6fb" stroke="#0072b2" stroke-width="2" stroke-dasharray="8 6"/>
<text x="48" y="120" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">CONTEXT — surrounds and shapes every concept</text>
<rect x="70" y="155" width="360" height="90" rx="10" fill="#edf6fb" stroke="#0072b2" stroke-width="2"/>
<text x="94" y="190" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">Need</text>
<text x="94" y="227" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">A problem or opportunity</text>
<rect x="530" y="155" width="360" height="90" rx="10" fill="#edf6fb" stroke="#0072b2" stroke-width="2"/>
<text x="554" y="190" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">Change</text>
<text x="554" y="227" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">Transformation in response</text>
<path d="M 434 195 L 526 195" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="285" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="middle">Need drives change; change can create needs.</text>
<rect x="70" y="320" width="820" height="90" rx="10" fill="#edf6fb" stroke="#0072b2" stroke-width="2"/>
<text x="94" y="355" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">Solution</text>
<text x="94" y="392" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">Satisfies one or more needs</text>
<path d="M 250 316 L 250 249" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 480 414 L 480 460" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="466" width="820" height="90" rx="10" fill="#edf6fb" stroke="#0072b2" stroke-width="2"/>
<text x="94" y="501" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">Value</text>
<text x="94" y="538" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">Worth, importance, or usefulness</text>
<path d="M 480 560 L 480 606" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="612" width="820" height="90" rx="10" fill="#edf6fb" stroke="#0072b2" stroke-width="2"/>
<text x="94" y="647" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="700" text-anchor="start">Stakeholder</text>
<text x="94" y="684" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#172b3a" font-weight="400" text-anchor="start">Judges value within the context</text>
